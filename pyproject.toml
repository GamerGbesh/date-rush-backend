[project]
name = "date-rush"
version = "0.1.0"
description = "Live matchmaking event system backend"
authors = [
    { name = "Philemon", email = "gbesh.12@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.19.1",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "httpx2>=2.12.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
